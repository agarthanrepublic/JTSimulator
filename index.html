<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JT Simulator</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e1220;overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #wrap{width:100%;height:100%}
  canvas{width:100%;height:100%;display:block;touch-action:none;
    user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
'use strict';
window.addEventListener('error',function(e){
  var d=document.getElementById('jserr');
  if(!d){d=document.createElement('div');d.id='jserr';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#b00;color:#fff;font:12px monospace;padding:4px;white-space:pre-wrap';
    document.body.appendChild(d);}
  d.textContent+='ERR: '+e.message+' @ line '+e.lineno+':'+e.colno+'\n';
});
const canvas=document.getElementById('game');
const realCtx=canvas.getContext('2d');
let W=0,H=0,S=1,DPR=1,PORTRAIT=false;
const TOUCH=(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

let BASE_X=0,CREST_X=0,BASE_Y=0,CREST_Y=0,FAR_Y=0,CAR_START=0;

const boundCache=new Map();
const ctx=new Proxy(realCtx,{
  get(t,p){
    const v=t[p];
    if(typeof v!=='function')return v;
    if(!boundCache.has(p))boundCache.set(p,v.bind(t));
    return boundCache.get(p);
  },
  set(t,p,v){
    if(p==='font'&&typeof v==='string')
      v=v.replace(/(\d+(?:\.\d+)?)px/g,(m,n)=>Math.round(parseFloat(n)*S)+'px');
    t[p]=v;
    return true;
  }
});

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  PORTRAIT=H>W;
  S=Math.min(Math.max(Math.min(W,H)/(PORTRAIT?560:540),0.62),1.5);
  BASE_X=W*0.08;
  CREST_X=PORTRAIT?W*0.74:W*0.78;
  BASE_Y=H*0.84;
  CREST_Y=PORTRAIT?H*0.30:H*0.34;
  FAR_Y=H*0.60;
  CAR_START=PORTRAIT?Math.max(W*0.34,150):W*0.17;
}

const TOTAL_PUSHES=7,MAX_HEARTS=3;

const G={
  mode:'title',modeT:0,successes:0,hearts:3,carP:0,carFrom:0,carTo:0,
  animT:0,animKind:'',qte:null,winT:0,winSpeed:70,carDriveX:0,carGone:false,
  confetti:[],puffs:[],texts:[],wheelRot:0,walkPh:0,shake:0,flash:0,
  snapPop:-1,screaming:false,snapPlayed:false,screamPlayed:false,puffTimer:0,
  line1Shown:false,line2Shown:false,jamesPose:'idle'
};

const clouds=[
  {x:120,y:70,s:1.0,v:9},{x:480,y:110,s:0.7,v:6},{x:760,y:60,s:1.2,v:12}
];

function lerp(a,b,k){return a+(b-a)*k;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function easeOutCubic(k){return 1-Math.pow(1-k,3);}
function easeOutBack(k){const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);}

function hillY(x){
  if(x<=BASE_X)return BASE_Y;
  if(x<=CREST_X){const t=(x-BASE_X)/(CREST_X-BASE_X);const s=t*t*(3-2*t);return BASE_Y-(BASE_Y-CREST_Y)*s;}
  const t2=Math.min(1,(x-CREST_X)/(W*1.15-CREST_X));
  return CREST_Y+(FAR_Y-CREST_Y)*Math.pow(t2,1.3);
}
function hillSlope(x){return Math.atan2(hillY(x+3)-hillY(x-3),6);}
function carXAt(p){return lerp(CAR_START,CREST_X-26,p);}
function carCenterX(){
  if(G.mode==='victory'||G.carGone)return null;
  if(G.mode==='win')return G.carDriveX;
  return carXAt(G.carP);
}
function carPoint(lx,ly){
  const cx=carCenterX();if(cx===null)return null;
  const cy=hillY(cx),a=hillSlope(cx);
  return [cx+Math.cos(a)*lx-Math.sin(a)*ly, cy+Math.sin(a)*lx+Math.cos(a)*ly];
}

let AC=null,master=null,muted=false;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function now(){return ac().currentTime;}
function env(g,t,a,peak,d){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
}
function tone(freq,type,t,dur,vol,slide){
  const c=ac();const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  env(g,t,0.012,vol,dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(t,dur,vol,type,f0,f1,q){
  const c=ac();const len=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,len,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=buf;
  const fl=c.createBiquadFilter();fl.type=type||'lowpass';
  fl.frequency.setValueAtTime(f0||800,t);
  if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  fl.Q.value=q||1;
  const g=c.createGain();env(g,t,0.005,vol,dur);
  src.connect(fl);fl.connect(g);g.connect(master);src.start(t);src.stop(t+dur+0.05);
}
function playReady(){const t=now();tone(520,'triangle',t,0.09,0.18);tone(780,'triangle',t+0.07,0.09,0.16);}
function playHeave(perfect){
  const t=now();
  tone(150,'sine',t,0.24,0.5,82);
  noise(t,0.12,0.16,'lowpass',420,180);
  if(perfect)tone(660,'triangle',t+0.02,0.16,0.22);
}
function playStrain(){const t=now();tone(122,'sawtooth',t,0.28,0.28,92);tone(244,'sawtooth',t,0.2,0.1,184);}
function playSnap(){
  const t=now();
  noise(t,0.09,0.9,'highpass',1800);
  tone(180,'square',t,0.16,0.5,38);
  tone(2300,'square',t,0.035,0.18);
}
function playScream(){
  const c=ac();const t=c.currentTime+0.02;const dur=1.9;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.55,t+0.06);
  g.gain.setValueAtTime(0.55,t+dur-0.5);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;
  bp.frequency.setValueAtTime(1100,t);
  bp.frequency.linearRampToValueAtTime(600,t+dur);
  const o1=c.createOscillator();o1.type='sawtooth';
  const c1=new Float32Array([640,790,730,765,695,645,600,560,520,470,435,400]);
  o1.frequency.setValueCurveAtTime(c1,t,dur);
  const o2=c.createOscillator();o2.type='sawtooth';
  const c2=new Float32Array([321,396,367,383,348,324,301,281,261,236,218,201]);
  o2.frequency.setValueCurveAtTime(c2,t,dur);
  const lfo=c.createOscillator();lfo.frequency.value=7.3;
  const lg=c.createGain();lg.gain.value=22;
  lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
  o1.connect(bp);o2.connect(bp);bp.connect(g);g.connect(master);
  o1.start(t);o2.start(t);lfo.start(t);
  o1.stop(t+dur);o2.stop(t+dur);lfo.stop(t+dur);
  noise(t+0.02,0.5,0.05,'bandpass',1400,900,2);
}
function playJingle(){
  const t=now();
  const notes=[523.25,659.25,783.99,1046.5,1318.5];
  notes.forEach((f,i)=>{
    tone(f,'triangle',t+i*0.13,0.5,0.22);
    tone(f/2,'sine',t+i*0.13,0.5,0.1);
  });
}
function playEngine(){
  const c=ac();const t=c.currentTime;const dur=2.6;
  const o=c.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(48,t);o.frequency.linearRampToValueAtTime(85,t+dur);
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.22,t+0.15);
  g.gain.setValueAtTime(0.22,t+dur-0.3);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const lfo=c.createOscillator();lfo.frequency.value=26;
  const lg=c.createGain();lg.gain.value=0.08;
  lfo.connect(lg);lg.connect(g.gain);
  o.connect(f);f.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur);lfo.start(t);lfo.stop(t+dur);
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.9;}
function playHonk(){
  const t=now();
  tone(330,'square',t,0.16,0.1);tone(415,'square',t,0.16,0.1);
  tone(330,'square',t+0.22,0.22,0.11);tone(415,'square',t+0.22,0.22,0.11);
}
function playFlirt(){
  const t=now();
  tone(760,'triangle',t,0.14,0.16,620);
  tone(700,'triangle',t+0.16,0.14,0.16,540);
  tone(820,'triangle',t+0.34,0.2,0.16,600);
}
function playZing(){
  const t=now();
  tone(262,'square',t,0.16,0.13);
  tone(330,'square',t+0.14,0.16,0.13);
  tone(392,'square',t+0.28,0.34,0.16);
}

function addText(txt,x,y,col,size){
  G.texts.push({txt,x,y,vy:-34,t:0,life:0.9,col:col||'#fff',size:size||26});
}
function spawnDust(x,y,n){
  for(let i=0;i<(n||3);i++)
    G.puffs.push({x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*6,r:4+Math.random()*6,a:0.5,vx:(Math.random()-0.5)*30,vy:-14-Math.random()*20});
}
function spawnConfetti(){
  const cols=['#ffd93b','#e23b4e','#4ecdc4','#a06cd5','#7bb661'];
  for(let i=0;i<140;i++)
    G.confetti.push({x:Math.random()*W,y:-Math.random()*H*0.6,vx:Math.random()*30-15,vy:60+Math.random()*90,rot:Math.random()*6.28,vr:(Math.random()-0.5)*6,col:cols[i%cols.length],w:6+Math.random()*6,h:4+Math.random()*4});
}

function resetGame(){
  G.mode='title';G.modeT=0;G.successes=0;G.hearts=3;G.carP=0;
  G.carFrom=0;G.carTo=0;G.animT=0;G.animKind='';G.qte=null;
  G.winT=0;G.winSpeed=70;G.carGone=false;G.carDriveX=0;
  G.confetti=[];G.puffs=[];G.texts=[];G.wheelRot=0;G.walkPh=0;
  G.shake=0;G.flash=0;G.snapPop=-1;G.screaming=false;
  G.snapPlayed=false;G.screamPlayed=false;G.jamesPose='idle';
  G.line1Shown=false;G.line2Shown=false;
}
function startQTE(){
  const r=G.successes;
  const period=Math.max(0.72,1.45-r*0.105);
  const zoneW=Math.max(0.085,0.19-r*0.014);
  const zoneStart=0.22+Math.random()*(0.53-zoneW);
  G.qte={t:0,period,zoneStart,zoneW,resolved:false};
  G.mode='qte';G.modeT=0;
  playReady();
}
function beginWin(){
  G.mode='win';G.modeT=0;G.winT=0;G.winSpeed=70;
  G.carDriveX=carXAt(1);G.jamesPose='wave';G.puffTimer=0;
  G.line1Shown=false;G.line2Shown=false;
  playEngine();playHonk();
  addText('BEEP BEEP!',carXAt(1),hillY(carXAt(1))-140,'#ffd93b',24);
}
function beginSnap(){
  G.mode='snap';G.modeT=0;G.snapPop=-1;G.screaming=false;
  G.snapPlayed=false;G.screamPlayed=false;G.jamesPose='fallen';G.shake=0;
}
function successQTE(perfect){
  G.qte.resolved=true;
  playHeave(perfect);
  const cx=carXAt(G.carP);
  addText(perfect?'PERFECT HEAVE!':'HEAVE!',cx,hillY(cx)-130,perfect?'#ffd93b':'#ffffff',perfect?30:26);
  G.successes++;
  G.carFrom=G.carP;
  G.carTo=Math.min(1,G.carP+1/TOTAL_PUSHES);
  G.mode='anim';G.animKind='push';G.animT=0;
  G.jamesPose='push';G.walkPh=0;
  G.shake=Math.max(G.shake,perfect?4:2);
  const bp=carPoint(-38,0);
  if(bp)spawnDust(bp[0],bp[1],3);
}
function failQTE(msg){
  G.qte.resolved=true;
  G.hearts--;
  playStrain();
  addText(msg||'MISS!',W/2,H-170,'#ff5a4e',28);
  G.shake=7;
  if(G.hearts<=0){beginSnap();}
  else{
    G.mode='anim';G.animKind='strain';G.animT=0;G.jamesPose='strain';
  }
}
function pressQTE(){
  const q=G.qte;
  if(q.t*q.period<0.18)return;
  const n=Math.min(1,q.t);
  const inZ=n>=q.zoneStart&&n<=q.zoneStart+q.zoneW;
  if(inZ){
    const c=q.zoneStart+q.zoneW/2;
    successQTE(Math.abs(n-c)<q.zoneW*0.18);
  }else{
    failQTE(n<q.zoneStart?'TOO EARLY!':'TOO LATE!');
  }
}
function onAction(){
  ac();
  if(G.mode==='title'){resetGame();startQTE();}
  else if(G.mode==='qte'&&G.qte&&!G.qte.resolved){pressQTE();}
  else if(G.mode==='victory'||G.mode==='lose'){resetGame();startQTE();}
}

function update(dt){
  G.modeT+=dt;
  G.shake*=Math.pow(0.002,dt);if(G.shake<0.2)G.shake=0;
  G.flash=Math.max(0,G.flash-dt*1.6);
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i];t.t+=dt;t.y+=t.vy*dt;
    if(t.t>t.life)G.texts.splice(i,1);
  }
  for(let i=G.puffs.length-1;i>=0;i--){
    const p=G.puffs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=8*dt;p.a-=0.55*dt;
    if(p.a<=0)G.puffs.splice(i,1);
  }
  if(G.mode==='victory'){
    for(let i=G.confetti.length-1;i>=0;i--){
      const p=G.confetti[i];
      p.y+=p.vy*dt;p.x+=p.vx*dt+Math.sin(p.y*0.05)*24*dt;p.rot+=p.vr*dt;
      if(p.y>H+20)G.confetti.splice(i,1);
    }
  }
  if(G.mode==='qte'&&G.qte){
    const q=G.qte;q.t+=dt/q.period;
    if(!q.resolved&&q.t>=1)failQTE('TOO LATE!');
  }
  else if(G.mode==='anim'){
    G.animT+=dt;
    if(G.animKind==='push'){
      const k=Math.min(1,G.animT/0.75);
      const prev=G.carP;
      G.carP=lerp(G.carFrom,G.carTo,easeOutCubic(k));
      G.wheelRot+=(carXAt(G.carP)-carXAt(prev))/15;
      G.walkPh+=dt*20;
      if(k>=1){
        if(G.successes>=TOTAL_PUSHES){beginWin();}
        else{G.jamesPose='idle';startQTE();}
      }
    }else{
      if(G.animT>0.6){G.jamesPose='idle';startQTE();}
    }
  }
  else if(G.mode==='win'){
    G.winT+=dt;G.winSpeed+=150*dt;
    G.carDriveX+=G.winSpeed*dt;
    G.wheelRot+=G.winSpeed*dt/15;
    G.puffTimer-=dt;
    if(G.puffTimer<=0){
      G.puffTimer=0.07;
      const ep=carPoint(-78,-8);
      if(ep)G.puffs.push({x:ep[0],y:ep[1],r:5+Math.random()*4,a:0.45,vx:-30-Math.random()*20,vy:-16-Math.random()*14});
    }
    if(!G.carGone&&G.carDriveX>W+150)G.carGone=true;
    if(!G.line1Shown&&G.winT>=1.0){G.line1Shown=true;playFlirt();}
    if(!G.line2Shown&&G.winT>=3.4){G.line2Shown=true;playZing();}
    if(G.winT>5.6){G.mode='victory';G.modeT=0;playJingle();spawnConfetti();}
  }
  else if(G.mode==='snap'){
    if(!G.snapPlayed&&G.modeT>=0.3){
      G.snapPlayed=true;playSnap();G.flash=0.85;G.shake=16;G.snapPop=0;
    }
    if(G.snapPop>=0)G.snapPop=Math.min(1,G.snapPop+dt*3.5);
    if(!G.screamPlayed&&G.modeT>=0.6){
      G.screamPlayed=true;G.screaming=true;playScream();
    }
    if(G.modeT>3.4){G.mode='lose';G.modeT=0;}
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function limb(ax,ay,bx,by,bend){
  const mx=(ax+bx)/2,my=(ay+by)/2;
  const dx=bx-ax,dy=by-ay;
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  ctx.beginPath();
  ctx.moveTo(ax,ay);
  ctx.lineTo(mx+nx*bend,my+ny*bend);
  ctx.lineTo(bx,by);
  ctx.stroke();
}
function star(cx,cy,ro,ri,points,rot){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const r=i%2===0?ro:ri;
    const a=rot+i*Math.PI/points;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function drawHeart(cx,cy,s,filled){
  ctx.beginPath();
  ctx.moveTo(cx,cy+s*0.9);
  ctx.bezierCurveTo(cx-s*1.4,cy-s*0.1,cx-s*0.7,cy-s*1.1,cx,cy-s*0.35);
  ctx.bezierCurveTo(cx+s*0.7,cy-s*1.1,cx+s*1.4,cy-s*0.1,cx,cy+s*0.9);
  ctx.closePath();
  if(filled){ctx.fillStyle='#e23b4e';ctx.fill();}
  ctx.strokeStyle=filled?'#8e1f2c':'rgba(255,255,255,0.5)';
  ctx.lineWidth=2;ctx.stroke();
}
function wrapText(str,maxW){
  const words=String(str).split(' ');
  const lines=[];
  let cur='';
  words.forEach(wd=>{
    const test=cur?cur+' '+wd:wd;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=wd;}
    else cur=test;
  });
  if(cur)lines.push(cur);
  return lines;
}

function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,H*0.8);
  g.addColorStop(0,'#7ec4f7');g.addColorStop(0.7,'#c9e6f5');g.addColorStop(1,'#ffe8c2');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sx=Math.max(90,W*0.11),sy=Math.max(80,H*0.10);
  const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,90);
  sg.addColorStop(0,'rgba(255,236,150,0.95)');sg.addColorStop(1,'rgba(255,236,150,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,90,0,7);ctx.fill();
  ctx.fillStyle='#ffdf6b';ctx.beginPath();ctx.arc(sx,sy,34,0,7);ctx.fill();
  ctx.save();ctx.translate(sx,sy);ctx.rotate(t*0.08);
  ctx.strokeStyle='rgba(255,223,107,0.6)';ctx.lineWidth=3;
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*44,Math.sin(a)*44);
    ctx.lineTo(Math.cos(a)*58,Math.sin(a)*58);
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  clouds.forEach(c=>{
    const x=((c.x+t*c.v)%(W+220))-110;
    ctx.beginPath();
    ctx.arc(x,c.y,20*c.s,0,7);
    ctx.arc(x+22*c.s,c.y+6*c.s,15*c.s,0,7);
    ctx.arc(x-20*c.s,c.y+7*c.s,13*c.s,0,7);
    ctx.fill();
  });
}
function drawGround(){
  ctx.beginPath();
  ctx.moveTo(0,hillY(0));

function drawWrapped(str,cx,y,maxW,lh){
  wrapText(str,maxW).forEach(l=>{ctx.fillText(l,cx,y);y+=lh;});
  return y;
}
function drawVictory(t){
  G.confetti.forEach(p=>{
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.col;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  const w=Math.min(680,W-24),h=PORTRAIT?360:300;
  const [x,y]=drawPanel(w,h);
  const prompt=TOUCH?'TAP TO PLAY AGAIN':'PRESS SPACE TO PLAY AGAIN';
  ctx.textAlign='center';
  ctx.font="900 56px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#ffd93b';
  ctx.fillText('YOU WIN!',W/2,y+64);
  let yy=y+108;
  ctx.font="600 20px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#e8eef7';
  yy=drawWrapped('The little old lady toots her horn, asks for his number...',W/2,yy,w-56,26);
  ctx.font="500 17px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#c9d4e3';
  yy=drawWrapped('James respectfully declined. Tendons: fully intact.',W/2,yy+6,w-56,24);
  ctx.font="600 14px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#8a94a8';
  yy=drawWrapped('She took it gracefully. Bridge club awaits.',W/2,yy+4,w-56,20);
  const a=0.55+0.45*Math.sin(t*4);
  ctx.font="800 22px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle=`rgba(255,255,255,${a})`;
  ctx.fillText(prompt,W/2,y+h-44);
}
function drawLoseOverlay(t){
  const w=Math.min(700,W-24),h=PORTRAIT?380:320;
  const [x,y]=drawPanel(w,h);
  const prompt=TOUCH?'TAP TO TRY AGAIN':'PRESS SPACE TO TRY AGAIN';
  ctx.textAlign='center';
  ctx.font="900 54px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#ff4d5e';
  ctx.fillText('GAME OVER',W/2,y+62);
  let yy=y+106;
  ctx.font="600 20px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#e8eef7';
  yy=drawWrapped("James' Achilles tendon snapped like a cheap guitar string.",W/2,yy,w-56,26);
  ctx.font="500 17px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#c9d4e3';
  yy=drawWrapped('The car remains. The scream echoes still.',W/2,yy+6,w-56,24);
  ctx.font="600 14px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#8a94a8';
  yy=drawWrapped('R.I.P._push_season.mp3',W/2,yy+4,w-56,20);
  const a=0.55+0.45*Math.sin(t*4);
  ctx.font="800 22px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle=`rgba(255,255,255,${a})`;
  ctx.fillText(prompt,W/2,y+h-44);
}
const muteBtn={x:28,y:28,r:19};
function drawMuteButton(){
  ctx.save();
  ctx.globalAlpha=0.85;
  ctx.fillStyle='rgba(10,14,24,0.55)';
  ctx.beginPath();ctx.arc(muteBtn.x,muteBtn.y,muteBtn.r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(muteBtn.x-9,muteBtn.y-4);
  ctx.lineTo(muteBtn.x-4,muteBtn.y-4);
  ctx.lineTo(muteBtn.x+2,muteBtn.y-9);
  ctx.lineTo(muteBtn.x+2,muteBtn.y+9);
  ctx.lineTo(muteBtn.x-4,muteBtn.y+4);
  ctx.lineTo(muteBtn.x-9,muteBtn.y+4);
  ctx.closePath();ctx.fill();
  if(!muted){
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(muteBtn.x+3,muteBtn.y,5,-0.9,0.9);ctx.stroke();
    ctx.beginPath();ctx.arc(muteBtn.x+3,muteBtn.y,9,-0.9,0.9);ctx.stroke();
  }else{
    ctx.strokeStyle='#ff5a4e';ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(muteBtn.x+6,muteBtn.y-5);ctx.lineTo(muteBtn.x+14,muteBtn.y+5);
    ctx.moveTo(muteBtn.x+14,muteBtn.y-5);ctx.lineTo(muteBtn.x+6,muteBtn.y+5);
    ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  const t=performance.now()/1000;
  realCtx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0.2)
    ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
  drawSky(t);
  drawGround();
  drawFlag(t);
  drawPuffs();
  drawCar(t);
  drawJames(t);
  drawTexts();
  if(G.mode==='qte'||G.mode==='anim')drawHUD();
  if(G.mode==='qte')drawQTE(t);
  if(G.mode==='snap'||G.mode==='lose')drawSnap(t);
  if(G.mode==='win'){
    if(G.line2Shown){
      const jx2=carXAt(1)-108,gy2=hillY(jx2);
      drawBubble(["\u201CI\u2019M GAY!\u201D"],jx2+28,Math.max(gy2-166,64),jx2+24,gy2-92,true);
    }else if(G.line1Shown){
      drawBubble(["Hey there, sugar!","Can I get your number?"],W-125,Math.max(80,CREST_Y-130),W-40,CREST_Y+40,false);
    }
  }
  ctx.restore();
  if(G.flash>0){
    ctx.fillStyle=`rgba(255,40,40,${G.flash})`;
    ctx.fillRect(0,0,W,H);
  }
  if(G.mode==='title')drawTitle(t);
  if(G.mode==='victory')drawVictory(t);
  if(G.mode==='lose')drawLoseOverlay(t);
  drawMuteButton();
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(!e.repeat)onAction();
  }else if(e.code==='KeyM'){
    toggleMute();
  }
});
function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height)];
}
function inRect(x,y,b){
  return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
}
canvas.addEventListener('pointermove',e=>{
  const [x,y]=canvasPos(e);
  if(G.mode==='title'&&!TOUCH){
    playBtn.hover=inRect(x,y,playBtnRect());
    canvas.style.cursor=playBtn.hover?'pointer':'default';
  }else if(!TOUCH){
    canvas.style.cursor='default';
  }
});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const [x,y]=canvasPos(e);
  if(Math.hypot(x-muteBtn.x,y-muteBtn.y)<=muteBtn.r+6){
    ac();toggleMute();
    return;
  }
  if(G.mode==='title'){
    if(TOUCH||inRect(x,y,playBtnRect()))onAction();
  }else{
    onAction();
  }
});

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
resize();

let last=performance.now();
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000);
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
